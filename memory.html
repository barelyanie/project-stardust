<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Collection</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="memoryPage">

    <h1 id="memoryTitle">Memory Collection ✨</h1>

    <p id="subtitle">
        Click anything that catches your eye first.
    </p>

    <div id="memoryBoard">

       <img src="images/memories/star.jpg" class="memoryItem" id="star">

       <img src="images/memories/green-heart.jpg" class="memoryItem" id="greenHeart">

       <img src="images/memories/cucumber.jpg" class="memoryItem" id="cucumber">

       <img src="images/memories/spiderman-cake.jpg" class="memoryItem" id="spiderman">

       <img src="images/memories/batman.jpg" class="memoryItem" id="batman">

       <img src="images/memories/love-pokeball.jpg" class="memoryItem" id="loveBall">

       <img src="images/memories/pokeball.jpg" class="memoryItem" id="pokeBall">

       <img src="images/memories/greninja.jpg" class="memoryItem" id="greninja">

       <img src="images/memories/ampharos.jpg" class="memoryItem" id="ampharos">

       <img src="images/memories/xayah-chibi.jpg" class="memoryItem" id="xayah">

       <img src="images/memories/rakan-chibi.jpg" class="memoryItem" id="rakan">

       <img src="images/memories/mel.jpg" class="memoryItem" id="mel">

       <img src="images/memories/gurren.jpg" class="memoryItem" id="gurren">

    </div>

<button id="finalButton">
    One More Thing... 💌
</button>

</div>

<div id="popup">

    <div id="popupCard">

        <span id="closePopup">✕</span>

        <h2 id="popupTitle"></h2>

        <p id="popupText"></p>

    </div>

</div>

<script src="memory.js"></script>

</body>

</html>
